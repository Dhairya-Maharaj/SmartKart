<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPTOP</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f044c 0%, #1d1b6d 50%, #2c2a96 100%);
            color: #f7f7f7;
            padding: 30px;
        }
        img {
            width: 15%;
            height: auto;
            display: block;
            margin: 0 auto 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
        h3 {
            color: #7ef7d2;
            font-size: 300%;
            font-weight: bolder;
            text-align: center;
        }
        p {
            font-size: 100%;
            color: #f7f7f7;
            max-width: 700px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }
        .price {
            font-size: 120%;
            color: #ffd700;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        a.button {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            font-size: 180%;
            background: linear-gradient(135deg, #a9a2cd 0%, #7f78a8 100%);
            padding: 10px 20px;
            border-radius: 8px;
            margin: 10px auto;
            display: block;
            width: fit-content;
        }
    </style>
</head>
<body>
    <img src="ELECTRONICS/images (3).jpg" alt="Laptop">
    <h3>Laptop</h3>
    <p>
        This is a Laptop. It is a powerful computing device used for various tasks such as work, study, and entertainment.
    </p>
    <p class="price">Price: ₹49,999</p>
    <a href="cart.html" class="button">Add to Cart</a>
</body>
</html>
